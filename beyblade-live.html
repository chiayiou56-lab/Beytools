<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰鬥陀螺｜賽事公開查詢</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09111f;color:#edf4ff}header{background:linear-gradient(125deg,#132a49,#101724);border-bottom:1px solid #2d3f5a;padding:30px 16px;text-align:center}header small{color:#54d3ff;letter-spacing:3px;font-weight:800}h1{margin:10px 0;color:#ffca55;font-size:clamp(25px,5vw,38px)}header p{color:#a8b7cc;margin:0;font-size:13px}main{max-width:1220px;margin:auto;padding:15px}.status{text-align:center;color:#a8b7cc;font-size:12px;margin:15px 0 20px}.status b{color:#54d3ff}.panel{background:#121e31;border:1px solid #30425e;border-radius:18px;padding:16px;margin:18px 0;box-shadow:0 10px 30px #0003}h2{font-size:18px;margin:0 0 5px;color:#54d3ff}.panel:nth-of-type(2) h2{color:#ffca55}.sub{color:#9baec6;font-size:12px;margin:0 0 17px}.scroll{overflow:auto;padding-bottom:12px}.bracket{display:flex;gap:16px;min-width:max-content}.round{width:245px;display:flex;flex-direction:column;gap:12px}.round-title{text-align:center;background:#0c1525;border:1px solid #30425e;border-radius:10px;padding:11px;color:#ffca55;font-weight:800;font-size:13px}.matches{display:flex;flex:1;flex-direction:column;justify-content:space-around;gap:13px}.match{border:1px solid #344761;border-radius:13px;background:#0b1627;padding:9px}.match-id{font-size:10px;color:#8098b5;margin:2px 6px 6px}.player{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px;border-radius:8px;font-size:13px}.player.win{background:#b58b2629;color:#ffd46b;font-weight:900}.player span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:17px;font-weight:900;color:#5cceff}.empty{padding:36px 15px;text-align:center;color:#a4b4cb;background:#0b1627;border:1px dashed #3a4a62;border-radius:12px}.table-wrap{overflow:auto}table{width:100%;min-width:570px;border-collapse:collapse}th,td{padding:12px 9px;border-bottom:1px solid #30425e;text-align:center;font-size:13px}th{color:#a5b6ca;background:#0c1525;font-size:11px}td:nth-child(2){text-align:left;font-weight:800}td:nth-child(3){color:#5cceff;font-weight:900}.rank{font-size:17px;font-weight:900}.rank.gold{color:#ffca55}.rank.silver{color:#cbd5e1}.rank.bronze{color:#df9b64}footer{text-align:center;color:#8395ad;font-size:12px;padding:15px 0 40px}#error{color:#fda4af}@media(max-width:500px){.panel{padding:13px}.round{width:215px}}
</style></head><body><header><small>BEYBLADE X TOURNAMENT</small><h1>賽事即時查詢</h1><p>淘汰賽對戰樹狀圖・決賽積分排行榜</p></header><main><div class="status"><b id="state">準備連線</b> <span id="time"></span><div id="error"></div></div><section class="panel"><h2>C 頁面｜淘汰賽樹狀圖</h2><p class="sub">向左右滑動，可查看所有對戰輪次與晉級結果</p><div class="scroll"><div class="bracket" id="bracket"><div class="empty">等待賽事資料…</div></div></div></section><section class="panel"><h2>🏆 D 頁面｜決賽積分排行榜</h2><p class="sub">勝場 3 積分，依積分、勝場、得失分差、總得分排序</p><div id="leaderboard" class="empty">等待決賽資料…</div></section><footer>本頁僅供查詢，不提供修改、計分或清除功能。</footer></main><script>
// 管理員部署前：請把管理後台「雲端設定」中的 Firebase JSON 貼在下方。
// Firebase 網頁設定不是密碼；真正的資料安全由 Firebase Database Rules 控制。
const FIREBASE_CONFIG = null;
// 例如：const FIREBASE_CONFIG = {"apiKey":"...","authDomain":"...","databaseURL":"...","projectId":"...","appId":"..."};
const DATA_PATH = 'beybladeTournamentData';
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n}
function renderBracket(data){const target=$('bracket');target.replaceChildren();const rounds=Array.isArray(data?.rounds)?data.rounds:[];if(!rounds.length){target.append(el('div','empty','尚未建立淘汰賽對戰表'));return}rounds.forEach((round,ri)=>{const col=el('div','round');col.append(el('div','round-title',`第 ${ri+1} 輪`));const matches=el('div','matches');(Array.isArray(round)?round:[]).forEach((m,mi)=>{const box=el('div','match');box.append(el('div','match-id',`對戰 ${mi+1}`));for(const side of [1,2]){const p=m?.['p'+side]||{};const isWinner=m?.winner&&p.id!=null&&m.winner.id===p.id;const row=el('div','player'+(isWinner?' win':''));row.append(el('span','',p.name||'待定'),el('span','score',m?.['score'+side]??0));box.append(row)}matches.append(box)});col.append(matches);target.append(col)})}
function renderLeaderboard(data){const root=$('leaderboard');root.replaceChildren();const players=Array.isArray(data?.players)?data.players:[];const matches=Array.isArray(data?.matches)?data.matches:[];if(!players.length){root.className='empty';root.textContent='尚未建立決賽名單';return}const stats=players.map(p=>{let wins=0,losses=0,ptsFor=0,ptsAgainst=0,matchPoints=0;matches.forEach(m=>{const s1=Number(m.s1)||0,s2=Number(m.s2)||0;if(m.p1?.id===p.id){ptsFor+=s1;ptsAgainst+=s2;if(m.winnerId===p.id){wins++;matchPoints+=3}else if(m.winnerId)losses++}if(m.p2?.id===p.id){ptsFor+=s2;ptsAgainst+=s1;if(m.winnerId===p.id){wins++;matchPoints+=3}else if(m.winnerId)losses++}});return {...p,wins,losses,ptsFor,ptsDiff:ptsFor-ptsAgainst,matchPoints}});stats.sort((a,b)=>b.matchPoints-a.matchPoints||b.wins-a.wins||b.ptsDiff-a.ptsDiff||b.ptsFor-a.ptsFor);root.className='table-wrap';const table=el('table'),thead=el('thead'),head=el('tr');['名次','選手','積分','勝場','敗場','總得分','得失分差'].forEach(t=>head.append(el('th','',t)));thead.append(head);table.append(thead);const tbody=el('tbody');stats.forEach((p,i)=>{const tr=el('tr');const values=[i+1,p.name||'未命名',p.matchPoints,p.wins,p.losses,p.ptsFor,(p.ptsDiff>0?'+':'')+p.ptsDiff];values.forEach((v,j)=>tr.append(el('td',j===0?'rank '+(['gold','silver','bronze'][i]||''):'',v)));tbody.append(tr)});table.append(tbody);root.append(table)}
function start(){if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.databaseURL){$('state').textContent='尚未完成雲端設定';$('error').textContent='請由管理員先在 HTML 中填入 FIREBASE_CONFIG';return}try{firebase.initializeApp(FIREBASE_CONFIG);firebase.database().ref(DATA_PATH).on('value',snap=>{const data=snap.val()||{};renderBracket(data.bracketData);renderLeaderboard(data.top3Data);$('state').textContent='● 即時連線中';$('time').textContent='｜更新於 '+new Date().toLocaleTimeString('zh-TW');$('error').textContent=''},err=>{$('state').textContent='讀取失敗';$('error').textContent=err.message})}catch(err){$('state').textContent='連線設定錯誤';$('error').textContent=err.message}}
start();
</script></body></html>
