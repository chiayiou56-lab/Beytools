</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><header><small>BEYBLADE X TOURNAMENT</small><h1>賽事即時查詢</h1><p>淘汰賽對戰樹狀圖・決賽積分排行榜</p><button type="button" class="qr-trigger" id="showQrBtn">▦ 顯示本頁 QR Code</button></header><main><div class="status"><b id="state">準備連線</b> <span id="time"></span><div id="error"></div></div><section class="panel"><h2>C 頁面｜淘汰賽樹狀圖</h2><p class="sub">向左右滑動，可查看所有對戰輪次與晉級結果</p><div class="scroll"><div class="bracket" id="bracket"><div class="empty">等待賽事資料…</div></div></div></section><section class="panel"><h2>🏆 D 頁面｜決賽積分排行榜</h2><p class="sub">勝場 3 積分，依積分、勝場、得失分差、總得分排序</p><div id="leaderboard" class="empty">等待決賽資料…</div></section><footer>本頁僅供查詢，不提供修改、計分或清除功能。</footer></main><div class="qr-overlay" id="qrOverlay" role="dialog" aria-modal="true" aria-labelledby="qrTitle" aria-hidden="true"><div class="qr-dialog"><h2 id="qrTitle">掃描 QR Code 查看賽事</h2><p>使用手機相機掃描，即可開啟這個公開查詢頁面。</p><div id="qrCode" class="qr-box"></div><div id="qrUrl" class="qr-url"></div><div class="qr-actions"><button type="button" class="qr-copy" id="copyQrUrl">複製網址</button><button type="button" class="qr-close" id="closeQrBtn">關閉</button></div><p id="qrHint" aria-live="polite"></p></div></div><script>
(function(){
const overlay=document.getElementById('qrOverlay'),box=document.getElementById('qrCode'),urlText=document.getElementById('qrUrl'),hint=document.getElementById('qrHint');
const currentUrl=location.href.split('#')[0];
function closeQr(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.getElementById('showQrBtn').focus()}
document.getElementById('showQrBtn').addEventListener('click',function(){
 overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');urlText.textContent=currentUrl;hint.textContent='';box.replaceChildren();
 if(location.protocol==='file:'){hint.textContent='目前是本機檔案網址，請先上傳網站，再開啟網站上的頁面產生可供其他人掃描的 QR Code。';return}
 if(typeof QRCode==='undefined'){hint.textContent='QR Code 套件載入失敗，請確認網路連線後重新整理。';return}
 try{new QRCode(box,{text:currentUrl,width:230,height:230,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){hint.textContent='產生 QR Code 失敗：'+e.message}
 document.getElementById('closeQrBtn').focus();
});
document.getElementById('closeQrBtn').addEventListener('click',closeQr);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeQr()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeQr()});
document.getElementById('copyQrUrl').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(currentUrl);hint.textContent='已複製網址'}catch(e){hint.textContent='無法自動複製，請長按上方網址複製'}});
})();
</script><script>

function renderBracket(data){const target=$('bracket');target.replaceChildren();const rounds=Array.isArray(data?.rounds)?data.rounds:[];if(!rounds.length){target.append(el('div','empty','尚未建立淘汰賽對戰表'));return}rounds.forEach((round,ri)=>{const col=el('div','round');col.append(el('div','round-title',`第 ${ri+1} 輪`));const matches=el('div','matches');(Array.isArray(round)?round:[]).forEach((m,mi)=>{const box=el('div','match');box.append(el('div','match-id',`對戰 ${mi+1}`));for(const side of [1,2]){const p=m?.['p'+side]||{};const isWinner=m?.winner&&p.id!=null&&m.winner.id===p.id;const row=el('div','player'+(isWinner?' win':''));row.append(el('span','',p.name||'待定'),el('span','score',m?.['score'+side]??0));box.append(row)}matches.append(box)});col.append(matches);target.append(col)})}
function renderLeaderboard(data){const root=$('leaderboard');root.replaceChildren();const players=Array.isArray(data?.players)?data.players:[];const matches=Array.isArray(data?.matches)?data.matches:[];if(!players.length){root.className='empty';root.textContent='尚未建立決賽名單';return}const stats=players.map(p=>{let wins=0,losses=0,ptsFor=0,ptsAgainst=0,matchPoints=0;matches.forEach(m=>{const s1=Number(m.s1)||0,s2=Number(m.s2)||0;if(m.p1?.id===p.id){ptsFor+=s1;ptsAgainst+=s2;if(m.winnerId===p.id){wins++;matchPoints+=3}else if(m.winnerId)losses++}if(m.p2?.id===p.id){ptsFor+=s2;ptsAgainst+=s1;if(m.winnerId===p.id){wins++;matchPoints+=3}else if(m.winnerId)losses++}});return {...p,wins,losses,ptsFor,ptsDiff:ptsFor-ptsAgainst,matchPoints}});stats.sort((a,b)=>b.matchPoints-a.matchPoints||b.wins-a.wins||b.ptsDiff-a.ptsDiff||b.ptsFor-a.ptsFor);root.className='table-wrap';const table=el('table'),thead=el('thead'),head=el('tr');['名次','選手','積分','勝場','敗場','總得分','得失分差'].forEach(t=>head.append(el('th','',t)));thead.append(head);table.append(thead);const tbody=el('tbody');stats.forEach((p,i)=>{const tr=el('tr');const values=[i+1,p.name||'未命名',p.matchPoints,p.wins,p.losses,p.ptsFor,(p.ptsDiff>0?'+':'')+p.ptsDiff];values.forEach((v,j)=>tr.append(el('td',j===0?'rank '+(['gold','silver','bronze'][i]||''):'',v)));tbody.append(tr)});table.append(tbody);root.append(table)}
function start(){if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.databaseURL){$('state').textContent='尚未完成雲端設定';$('error').textContent='請由管理員先在 HTML 中填入 FIREBASE_CONFIG';return}try{firebase.initializeApp(FIREBASE_CONFIG);firebase.database().ref(DATA_PATH).on('value',snap=>{const data=snap.val()||{};renderBracket(data.bracketData);renderLeaderboard(data.top3Data);$('state').textContent='● 即時連線中';$('time').textContent='｜更新於 '+new Date().toLocaleTimeString('zh-TW');$('error').textContent=''},err=>{$('state').textContent='讀取失敗';$('error').textContent=err.message})}catch(err){$('state').textContent='連線設定錯誤';$('error').textContent=err.message}}
